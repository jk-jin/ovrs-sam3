program: tools/train.py
name: full_dlrsd_loveda_final_v1
method: grid

metric:
  name: val/semantic.miou
  goal: maximize

parameters:
  logging.wandb.enabled:
    value: true

  logging.wandb.mode:
    value: offline

  logging.wandb.project:
    value: reca-sam3

  logging.wandb.group:
    value: main

  logging.wandb.name:
    value: dlrsd_loveda_full

  logging.wandb.tags:
    value:
      - reca-sam3
      - dlrsd-train
      - loveda-val
      - 64-templates

  visualization.enabled:
    value: true

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - configs/experiments/main/dlrsd_loveda_full.py

  - --work-dir
  - work_dirs/protocol/main/dlrsd_loveda_final_v1

  - --seed
  - "42"

  - --cfg-options
  - ${args_no_hyphens}
